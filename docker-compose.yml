services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: prepsphere_postgres

    environment:
      POSTGRES_DB: prepsphere
      POSTGRES_USER: prepsphere_user
      POSTGRES_PASSWORD: prepsphere_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: